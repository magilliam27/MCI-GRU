name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.15.12
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_docs_sot.py
      - name: Check test registry freshness
        run: python scripts/generate_test_registry.py --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install PyTorch (CPU, PyPI fallback)
        # download-r2.pytorch.org intermittently rejects non-browser TLS clients
        # (Cloudflare bot mitigation); fall back to the larger PyPI wheel.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch

      - name: Install torch-geometric
        run: pip install torch-geometric

      - name: Install package with dev extras
        run: pip install -e ".[dev,fred]"

      - name: Run capability-independent tests
        # Selection is marker-only: tests/conftest.py no longer infers external
        # capabilities from test names. Capabilities unavailable to this runner
        # (real market data files, LSEG Workspace) must carry their marker.
        run: python -m pytest tests/ -v -m "not requires_data and not requires_lseg" --timeout=120

      - name: Run end-to-end smoke
        run: python scripts/ci_smoke.py

  test-lock-stack:
    # D3 (#143): the pinned Linux CPU recipe from #218, pandas 3 on Python
    # 3.12.11, beside the Python 3.10 / pandas 2 floor job above.
    name: Test (Python 3.12.11 Linux CPU lock)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Create isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/lock-venv"
          echo "$RUNNER_TEMP/lock-venv/bin" >> "$GITHUB_PATH"

      - name: Install pinned bootstrap from exact hashed artifacts
        run: |
          python -m pip install --no-deps --require-hashes --force-reinstall \
            -r requirements-linux-cpu-bootstrap.lock

      - name: Install Linux CPU lock without resolving dependencies
        run: |
          python -m pip install --no-deps --no-build-isolation --require-hashes \
            -r requirements-linux-cpu.lock

      - name: Install package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e '.[dev,fred]'

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run capability-independent tests
        run: python -m pytest tests/ -v -m "not requires_data and not requires_lseg" --timeout=120

      - name: Run end-to-end smoke
        run: python scripts/ci_smoke.py
