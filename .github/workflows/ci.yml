name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff==0.15.12
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_docs_sot.py
      - name: Check test registry freshness
        run: python scripts/generate_test_registry.py --check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install PyTorch (CPU, PyPI fallback)
        # download-r2.pytorch.org intermittently rejects non-browser TLS clients
        # (Cloudflare bot mitigation); fall back to the larger PyPI wheel.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch

      - name: Install torch-geometric
        run: pip install torch-geometric

      - name: Install package with dev extras
        run: pip install -e ".[dev,fred]"

      - name: Run capability-independent tests
        # Selection is marker-only: tests/conftest.py no longer infers external
        # capabilities from test names. Capabilities unavailable to this runner
        # (real market data files, LSEG Workspace) must carry their marker.
        run: python -m pytest tests/ -v -m "not requires_data and not requires_lseg" --timeout=120

      - name: Run end-to-end smoke
        run: python scripts/ci_smoke.py
