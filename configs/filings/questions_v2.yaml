# Frozen question set for milestone 2 of the Jev filings pilot (#289): how did
# a risk factor change from last year? Do not edit a frozen version: a changed
# question is a new file (questions_v3.yaml).
#
# The state is built in code (mci_gru.filings.jev.pair_state): a current-year
# risk factor and its closest prior-year risk factor by TF-IDF, each as heading
# and text. The options are shuffled per pair (mci_gru.filings.change), so their
# order cannot steer the answer; the order used is part of each cache key.
version: 2
model: jev-1.13.0
questions:
  change_type:
    kind: choice
    instructions: >-
      Compare the current-year risk factor with the prior-year risk factor,
      which is its closest match in last year's filing. Which option best
      describes how the risk changed?
    options:
      same: >-
        The same risk, only lightly reworded or with updated figures or
        examples; nothing material was added or removed.
      broadened: >-
        The same risk, but the current version adds material scope, such as a
        new driver, exposure, product, jurisdiction or consequence.
      narrowed: >-
        The same risk, but the current version drops material scope that the
        prior version covered.
      reworked: >-
        The same underlying risk, but it both adds and drops material scope, or
        is rewritten so substantially that its emphasis changed.
      new: >-
        A different risk: the prior-year risk factor does not cover the risk
        the current one describes.
