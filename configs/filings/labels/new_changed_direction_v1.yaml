# Four questions, all answered on every item: E5's two yes/no questions (is
# the risk new, did it materially change?) followed by E8's two pick-one
# questions (worse, better or neutral, and the finer kind of change). The
# answer key of experiment E9 (filings/experiments/E9-direction-confirm), whose
# card asks for both sets word for word. Every question, help text and option
# below is copied unchanged from new_changed_v1.yaml and change_direction_v1.yaml
# (a test holds them equal); only the title and intro are new. The key reads
# each question's own majority; the category below only names the new/changed
# combination, as in new_changed_v1. Do not edit a version once labels exist
# against it.
id: new_changed_direction_v1
title: Is this a new risk, did it materially change, and did it get worse or better?
intro: >-
  Each item is one risk factor from a company's 10-K this year, beside the most
  similar risk factor in last year's 10-K. Read both and answer four questions:
  whether this year's risk is a different risk from last year's, whether the
  risk materially changed, and what the change from last year means for the
  company. Nothing is highlighted and no one else's answer is shown.
questions:
  whether this year's risk is a different risk from last year's, and whether
  the risk materially changed. Nothing is highlighted and no one else's answer
  is shown.
questions:
  - id: new_risk
    text: Is this year's risk a different risk from last year's?
    help: >-
      Answer yes if it is a different risk: the prior-year risk factor does not
      cover the risk the current one describes. Answer no if it is the same
      underlying risk, however much it was reworded, broadened, narrowed or
      rewritten.
  - id: changed
    text: Did this risk materially change from last year's version?
    help: >-
      Answer no only if it is the same risk, lightly reworded or with updated
      figures or examples, with nothing material added or removed. Answer yes
      for anything else, including when last year's text describes a different
      risk.
  - id: direction
    text: Did the change make this risk worse, better or neutral for the company?
    options:
      - id: worse
        text: >-
          the risk became more serious or more likely for the company (a new
          exposure, a wider scope, an event that actually happened, or a
          stronger warning).
      - id: better
        text: >-
          the risk eased (an exposure removed or shrunk, a matter resolved, or
          a softer warning).
      - id: neutral
        text: >-
          no change in how serious the risk is (rewording, updated figures or
          dates, reorganised text).
  - id: finer
    text: Which kind of change was it?
    help: >-
      The first three map to "worse" in Question 1, eased to "better", neutral
      to "neutral".
    options:
      - id: materialized
        text: >-
          it now reports that the risk actually happened (an incident, ruling,
          fine, loss or disruption).
      - id: new_exposure
        text: it adds a new driver, product, market, rule or counterparty.
      - id: escalated
        text: same exposure, but it warns of larger or likelier harm.
      - id: eased
        text: >-
          an exposure shrank or was removed, a matter was resolved, or the
          warning softened.
      - id: neutral
        text: wording, figures, dates or layout only.
categories:
  - {label: new, when: {new_risk: "yes"}}
  - {label: changed, when: {changed: "yes"}}
  - {label: unchanged, when: {}}
