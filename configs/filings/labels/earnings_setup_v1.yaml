# One choice question on an earnings release read against the company's
# previous one: did this period come in better or worse than the previous
# release set investors up to expect? The reading check of experiment E17
# (filings/experiments/E17-earnings-vs-previous): the question text and every
# option id and definition are configs/filings/questions_earnings_v1.yaml's
# setup question, word for word, so the reviewers and Jev read the same rubric.
# The options are listed as a scale, worst to best; a three-way split settles
# on the middle one. Do not edit a version once labels exist against it.
id: earnings_setup_v1
items: earnings_pair
title: Did this quarter come in better or worse than the previous release set up?
intro: >-
  Each item is one company's results release (an 8-K, item 2.02) with the
  company's previous results release, filed about one quarter earlier. Read
  both and answer one question. Nothing is highlighted and no one else's answer
  is shown.
questions:
  - id: setup
    text: >-
      This 8-K reports the company's quarterly or annual results. The
      state gives this results release (current_results_release) and the
      company's previous results release (previous_results_release),
      filed about one quarter earlier. Judge the CHANGE between the two
      releases, not how good the current release looks on its own. First
      work out what the previous release told investors: its trend in
      revenue, margins and earnings, any outlook or guidance for the
      coming period, and any targets. Then decide whether the current
      release came in better or worse than that. Strong-looking results
      are worse if growth slowed, margins fell, or the company missed or
      cut its own outlook. Weak-looking results, such as a loss, are
      better if they beat what the previous release set up. Releases are
      written to sound positive, so judge the numbers, not the wording.
    on_split: middle
    options:
      - id: much_worse
        text: >-
          Clearly below what the previous release set up: a large
          miss on its own outlook, guidance cut or withdrawn, a
          sharp reversal in growth or profit, or a new problem that
          dominates the release.
      - id: worse
        text: >-
          Somewhat below: growth slowing, margins slipping, a soft
          quarter against the prior trend, or guidance trimmed.
      - id: in_line
        text: >-
          Broadly what the previous release set up; nothing in this
          release changes the picture.
      - id: better
        text: >-
          Somewhat above: growth or margins improving against the
          prior trend, a stated target met early, or guidance nudged
          up.
      - id: much_better
        text: >-
          Clearly above: a large beat on the company's own outlook,
          guidance raised materially, or a step change in growth or
          profitability.
categories:
  - {label: worse, when: {setup: much_worse}}
  - {label: worse, when: {setup: worse}}
  - {label: better, when: {setup: better}}
  - {label: better, when: {setup: much_better}}
  - {label: in_line, when: {}}
