# @package _global_
# Experiment: Add Harvey-style volatility-targeting features to the momentum baseline.
# Compare against the same recipe with only include_volatility=true to isolate the new family.

defaults:
  - override /features: with_momentum

experiment_name: volatility_targeting

features:
  include_volatility: true
  include_volatility_targeting: true
  volatility_targeting_half_lives: [20, 60, 90]
  volatility_target_vol: 0.10
  volatility_target_scale_clip: [0.25, 4.0]
  volatility_targeting_interaction_return_window: 21
