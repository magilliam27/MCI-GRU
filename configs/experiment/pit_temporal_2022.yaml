# @package _global_
# True rolling PIT S&P 500 panel: train 2016-2020, val 2021, test 2022.

experiment_name: pit_true_rolling_2022

data:
  universe: sp500
  source: csv
  filename: data/raw/market/sp500_2016_universe_data.csv
  train_start: "2016-01-01"
  train_end: "2020-12-31"
  val_start: "2021-01-22"
  val_end: "2021-12-31"
  test_start: "2022-01-22"
  test_end: "2022-12-31"
  filter_stocks_per_split: false
  use_pit_universe: true
  pit_universe_csv: data/raw/constituents/sp500_pit_joiner_leaver_20160101_20260513_pit_universe.csv
  pit_universe_mode: masked_panel
  pit_min_scoreable_stocks: 450
  pit_breadth_policy: error
